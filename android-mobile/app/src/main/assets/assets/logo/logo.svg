<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Vibrant WAVEN Multi-Stop Sonic Gradient -->
    <linearGradient id="wavenWaveGrad" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="28%" stop-color="#3b82f6" />
      <stop offset="55%" stop-color="#8b5cf6" />
      <stop offset="78%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Deep Ambient Glow Gradient -->
    <radialGradient id="wavenAmbient" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.32" />
      <stop offset="45%" stop-color="#06b6d4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Border Glow -->
    <linearGradient id="wavenBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)" />
      <stop offset="50%" stop-color="rgba(139,92,246,0.3)" />
      <stop offset="100%" stop-color="rgba(6,182,212,0.18)" />
    </linearGradient>

    <!-- Intense Bloom Glow Filter -->
    <filter id="wavenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Luxury Squircle Outer Container -->
  <rect width="200" height="200" rx="46" fill="#090b11" />
  
  <!-- Subtle Internal Radial Ambient Light -->
  <rect width="200" height="200" rx="46" fill="url(#wavenAmbient)" />
  
  <!-- Glass Bevel Rim -->
  <rect x="1.5" y="1.5" width="197" height="197" rx="45" fill="none" stroke="url(#wavenBorder)" stroke-width="1.8" />

  <!-- Concentric Acoustic Vinyl Grooves -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.2" stroke-dasharray="3 5" />
  <circle cx="100" cy="100" r="62" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1" />
  <circle cx="100" cy="100" r="48" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1" stroke-dasharray="2 4" />

  <!-- Outer Neon Atmospheric Aura -->
  <g filter="url(#wavenGlow)" opacity="0.65">
    <path d="M 40,82 C 48,82 56,138 69,138 C 82,138 89,68 100,68 C 111,68 118,138 131,138 C 144,138 152,82 160,82"
          fill="none"
          stroke="url(#wavenWaveGrad)"
          stroke-width="18"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>

  <!-- Primary Solid Sonic Wave "W" -->
  <g>
    <path d="M 40,82 C 48,82 56,138 69,138 C 82,138 89,68 100,68 C 111,68 118,138 131,138 C 144,138 152,82 160,82"
          fill="none"
          stroke="url(#wavenWaveGrad)"
          stroke-width="13"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Specular White Crest Highlights -->
    <path d="M 43,82 C 49,82 55,124 67,133"
          fill="none"
          stroke="rgba(255,255,255,0.65)"
          stroke-width="3"
          stroke-linecap="round" />
    <path d="M 94,76 C 97,70 103,70 106,76"
          fill="none"
          stroke="rgba(255,255,255,0.85)"
          stroke-width="3.5"
          stroke-linecap="round" />
    <path d="M 133,133 C 145,124 151,82 157,82"
          fill="none"
          stroke="rgba(255,255,255,0.55)"
          stroke-width="3"
          stroke-linecap="round" />
  </g>

  <!-- Soundwave Center Core Dots -->
  <circle cx="100" cy="68" r="4.5" fill="#ffffff" filter="drop-shadow(0 0 4px #8b5cf6)" />
  <circle cx="69" cy="138" r="3.5" fill="#38bdf8" />
  <circle cx="131" cy="138" r="3.5" fill="#ec4899" />

  <!-- Equalizer Frequency Cadence at Bottom -->
  <g opacity="0.85">
    <rect x="68" y="162" width="5" height="10" rx="2.5" fill="#06b6d4" />
    <rect x="78" y="157" width="5" height="15" rx="2.5" fill="#3b82f6" />
    <rect x="88" y="153" width="5" height="19" rx="2.5" fill="#6366f1" />
    <rect x="98" y="149" width="5" height="23" rx="2.5" fill="#a855f7" />
    <rect x="108" y="153" width="5" height="19" rx="2.5" fill="#d946ef" />
    <rect x="118" y="157" width="5" height="15" rx="2.5" fill="#ec4899" />
    <rect x="128" y="162" width="5" height="10" rx="2.5" fill="#f43f5e" />
  </g>
</svg>
