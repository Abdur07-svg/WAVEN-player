name: Build & Release WAVEN APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (must match format vX.Y.Z, e.g. v1.0.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Verify WAVEN Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Release Tag (Strict Semantic Versioning)
        id: release_info
        run: |
          TAG=""
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          fi

          echo "Target Release Tag: '$TAG'"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.*)?$ ]]; then
            echo "::error title=Invalid Release Tag::Tag '$TAG' does not follow SemVer format 'vX.Y.Z' (e.g. 'v1.0.3'). Releases cannot be created with raw branch names like '${{ github.ref_name }}'."
            exit 1
          fi
          TAG_VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version_name=$TAG_VERSION" >> $GITHUB_OUTPUT

      - name: Validate Required Signing Secrets
        run: |
          MISSING=0
          if [ -z "${{ secrets.WAVEN_RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "::error title=Missing Secret::WAVEN_RELEASE_KEYSTORE_BASE64 secret is missing in GitHub repository settings."
            MISSING=1
          fi
          if [ -z "${{ secrets.WAVEN_KEYSTORE_PASSWORD }}" ]; then
            echo "::error title=Missing Secret::WAVEN_KEYSTORE_PASSWORD secret is missing in GitHub repository settings."
            MISSING=1
          fi
          if [ -z "${{ secrets.WAVEN_KEY_ALIAS }}" ]; then
            echo "::error title=Missing Secret::WAVEN_KEY_ALIAS secret is missing in GitHub repository settings."
            MISSING=1
          fi
          if [ $MISSING -ne 0 ]; then
            echo "::error::Release build terminated: Production release signing requires all 3 secrets. Debug or dummy keys are not permitted."
            exit 1
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK Tools & API 34
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Decode Production Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.WAVEN_RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android-mobile/.keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android-mobile/.keystore/waven_release.keystore
          if [ ! -s android-mobile/.keystore/waven_release.keystore ]; then
            echo "::error::Decoded keystore is empty or corrupted! Check WAVEN_RELEASE_KEYSTORE_BASE64 secret."
            exit 1
          fi

      - name: Run WAVEN Custom Python Build & Verification Pipeline
        env:
          CI: 'true'
          WAVEN_VERSION_NAME: ${{ steps.release_info.outputs.version_name }}
          WAVEN_KEYSTORE_PASSWORD: ${{ secrets.WAVEN_KEYSTORE_PASSWORD }}
          WAVEN_KEY_ALIAS: ${{ secrets.WAVEN_KEY_ALIAS }}
          WAVEN_KEYSTORE_PATH: android-mobile/.keystore/waven_release.keystore
          WAVEN_OUTPUT_DIR: dist
        run: |
          python build_waven_apk.py

      - name: Upload Verified Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WAVEN-Music-Player-${{ steps.release_info.outputs.tag }}
          path: dist/WAVEN-Music-Player.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create Official GitHub Release and Publish APK
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WAVEN-Music-Player.apk
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: WAVEN Music Player ${{ steps.release_info.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
