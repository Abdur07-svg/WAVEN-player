<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | WAVEN</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    body {
      background-color: #0e0e13;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      box-sizing: border-box;
    }
    .card {
      max-width: 440px;
      background: #131318;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 3rem 2rem;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.7);
    }
    .code {
      font-size: 5rem;
      font-weight: 900;
      line-height: 1;
      color: #ccf22e;
      margin-bottom: 1rem;
      text-shadow: 0 0 24px rgba(204, 242, 46, 0.4);
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 0.75rem 0;
    }
    p {
      color: rgba(255, 255, 255, 0.65);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.875rem 1.5rem;
      border-radius: 9999px;
      background: #ccf22e;
      color: #171e00;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      box-sizing: border-box;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Out of Range</h1>
    <p>The requested page or resource could not be found. Return to WAVEN to explore the music player.</p>
    <a href="index.html" class="btn">Return to WAVEN</a>
  </div>
</body>
</html>
